name: Mainline Escalation Probe

# Merge an upstream mainline/stable ref into a Pox branch and probe the build.
# Designed to run the heavy git clone + kernel build in CI (local machine cannot).

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo URL'
        required: true
        default: 'https://github.com/torvalds/linux'
      upstream_ref:
        description: 'Upstream tag/ref to merge (e.g. v4.15)'
        required: true
      base_branch:
        description: 'Branch to start from'
        required: true
        default: 'onyx'
      target_branch:
        description: 'Branch to create/check out'
        required: true
      merge_strategy:
        description: 'git merge -X strategy'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - ours
          - theirs
          - union
      resolve_conflicts:
        description: 'How to resolve conflicts so the build can proceed'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - theirs
          - ours
          - auto-vendor
      attempt_build:
        description: 'Attempt kernel build after the merge'
        required: true
        default: true
        type: boolean
      push_result:
        description: 'Push the resulting branch'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  escalate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ${{ inputs.base_branch }} (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_branch }}

      - name: Configure git identity
        run: |
          git config user.name  "Pox Escalation Bot"
          git config user.email "escalation@pox.local"

      - name: Record base info
        run: |
          {
            echo "### Escalation probe"
            echo ""
            echo "- base branch : ${{ inputs.base_branch }}"
            echo "- base commit : $(git rev-parse --short HEAD)"
            echo "- base version: $(sed -n 's/^VERSION = //p;s/^PATCHLEVEL = //p;s/^SUBLEVEL = //p' Makefile | paste -sd. -)"
            echo "- upstream    : ${{ inputs.upstream_repo }} @ ${{ inputs.upstream_ref }}"
            echo "- target      : ${{ inputs.target_branch }}"
            echo "- strategy    : ${{ inputs.merge_strategy }} / resolve=${{ inputs.resolve_conflicts }}"
            echo ""
          } > report.md

      - name: Add upstream remote and fetch ref
        run: |
          set -euo pipefail
          git remote add upstream "${{ inputs.upstream_repo }}" 2>/dev/null || git remote set-url upstream "${{ inputs.upstream_repo }}"
          git fetch --no-tags upstream "${{ inputs.upstream_ref }}"
          UP_SHA=$(git rev-parse FETCH_HEAD)
          echo "UPSTREAM_SHA=$UP_SHA" >> $GITHUB_ENV
          echo "upstream sha: $UP_SHA"
          echo "- upstream sha: \`$UP_SHA\`" >> report.md

      - name: Compute merge base and delta size
        run: |
          set +e
          MB=$(git merge-base HEAD "$UPSTREAM_SHA" 2>&1)
          echo "MERGE_BASE=$MB" >> $GITHUB_ENV
          {
            echo "- merge-base: \`$MB\`"
          } >> report.md
          if [[ -n "$MB" ]]; then
            AHEAD=$(git rev-list --count "$MB..HEAD")
            BEHIND=$(git rev-list --count "$MB..$UPSTREAM_SHA")
            echo "- commits vendor-side (ahead): $AHEAD"  >> report.md
            echo "- commits upstream-side (behind): $BEHIND" >> report.md
          fi
          echo "=== merge-base: $MB"
          git --no-pager diff --shortstat "$MB" HEAD || true
          git --no-pager diff --shortstat "$MB" "$UPSTREAM_SHA" || true

      - name: Create branch and merge upstream
        id: merge
        run: |
          set +e
          git checkout -B "${{ inputs.target_branch }}"
          case "${{ inputs.merge_strategy }}" in
            ours)   X="-X ours" ;;
            theirs) X="-X theirs" ;;
            union)  X="-X union" ;;
            *)      X="" ;;
          esac
          git merge --no-commit --no-ff $X "$UPSTREAM_SHA" > merge_out.txt 2>&1
          echo "merge_exit=$?" >> $GITHUB_OUTPUT
          git diff --name-only --diff-filter=U > conflicts.txt
          CONFLICTS=$(wc -l < conflicts.txt | tr -d ' ')
          echo "conflicts=$CONFLICTS" >> $GITHUB_OUTPUT
          echo "=== merge exit / conflicts: $CONFLICTS"

      - name: Summarize conflicts
        run: |
          set +e
          CONFLICTS=$(wc -l < conflicts.txt | tr -d ' ')
          {
            echo ""
            echo "## Merge result"
            echo ""
            echo "- merge exit code: ${{ steps.merge.outputs.merge_exit }}"
            echo "- **conflicted files: $CONFLICTS**"
            echo ""
          } >> report.md
          {
            echo "### merge output (tail)"
            echo '```'
            tail -40 merge_out.txt
            echo '```'
          } >> report.md
          if [[ "$CONFLICTS" -gt 0 ]]; then
            {
              echo ""
              echo "### conflict count by top-level dir"
              echo '```'
              awk -F/ '{if (NF>1) print $1"/"$2; else print $1}' conflicts.txt | sort | uniq -c | sort -rn | head -40
              echo '```'
              echo ""
              echo "### first 100 conflicted files"
              echo '```'
              head -100 conflicts.txt
              echo '```'
            } >> report.md
          fi
          cat report.md

      - name: Resolve conflicts (optional)
        if: inputs.resolve_conflicts != 'none'
        run: |
          set +e
          SIDE="${{ inputs.resolve_conflicts }}"
          UP="$UPSTREAM_SHA"

          # Wholesale per-file selection. Hunk-level -X merging produces MIXED
          # files (a kept vendor hunk referencing a symbol whose definition came
          # from the upstream hunk that was discarded) which cannot compile.
          # Instead: pick one whole version of each conflicted file.
          git merge --abort 2>/dev/null || true
          git merge --no-commit --no-ff "$UP" > merge_out2.txt 2>&1 || true
          git diff --name-only --diff-filter=U > unmerged.txt
          echo "unmerged paths: $(grep -c . unmerged.txt)"

          VENDOR_RE='mediatek|/mtk|mtk_|/mt6[0-9]|mt67|mt68|mtk-|dts/mediatek'
          : > pick_ours.txt ; : > pick_theirs.txt

          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            case "$SIDE" in
              ours)   first=--ours   ;;
              theirs) first=--theirs ;;
              auto-vendor)
                if echo "$f" | grep -Eq "$VENDOR_RE"; then first=--ours; else first=--theirs; fi
                ;;
              *)      first=--theirs ;;
            esac
            other=$([[ "$first" == "--ours" ]] && echo --theirs || echo --ours)

            if git checkout "$first" -- "$f" 2>/dev/null; then
              [[ "$first" == "--ours" ]] && echo "$f" >> pick_ours.txt || echo "$f" >> pick_theirs.txt
            elif git checkout "$other" -- "$f" 2>/dev/null; then
              [[ "$other" == "--ours" ]] && echo "$f" >> pick_ours.txt || echo "$f" >> pick_theirs.txt
            else
              git rm -f -- "$f" 2>/dev/null || true
            fi
          done < unmerged.txt

          SIDE="$SIDE (wholesale: ours=$(grep -c . pick_ours.txt), theirs=$(grep -c . pick_theirs.txt))"
          git add -A
          git -c user.name="Pox Escalation Bot" -c user.email="escalation@pox.local" \
              commit -m "merge(${{ inputs.upstream_ref }}): merge upstream into ${{ inputs.base_branch }} (resolved: $SIDE)" || true

          # Verify marker-free.
          git grep -l '^<<<<<<< ' > markers.txt 2>/dev/null || true
          if [[ -s markers.txt ]]; then
            echo "WARNING: conflict markers present in $(grep -c . markers.txt) files"
          else
            echo "verified: no conflict markers in tree"
          fi
          echo "resolved with: $SIDE" >> report.md

      - name: Install host build dependencies
        if: inputs.attempt_build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf libelf-dev libssl-dev lz4 \
            make zip python3 python-is-python3 libncurses5-dev libncurses5

      - name: Cache toolchain (kerdevdep)
        if: inputs.attempt_build
        uses: actions/cache@v4
        with:
          path: |
            kerdevdep/clang
            kerdevdep/gcc
            kerdevdep/anykernel
          key: kerdevdep-toolchains-v2
          restore-keys: |
            kerdevdep-toolchains-v2
            kerdevdep-toolchains-

      - name: Probe build
        id: build
        if: inputs.attempt_build
        run: |
          set +e
          bash kerdevdep/setup_kerdevdep.sh > setup.log 2>&1
          ./build.sh kernel > build_log.txt 2>&1
          RC=$?
          echo "build_rc=$RC" >> $GITHUB_OUTPUT
          ERE='error:|\bError [0-9]+|fatal error|\*\*\*|No such file or directory|undefined reference|not declared'
          ERRORS=$(grep -c -E "$ERE" build_log.txt || true)
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          {
            echo ""
            echo "## Build probe"
            echo ""
            echo "- build exit code: $RC"
            echo "- error-line matches: $ERRORS"
            echo ""
            echo "### head of build log (first 40 lines)"
            echo '```'
            head -40 build_log.txt
            echo '```'
            echo ""
            echo "### first 80 error lines"
            echo '```'
            grep -E "$ERE" build_log.txt | head -80
            echo '```'
            echo ""
            echo "### distinct error messages (top 40)"
            echo '```'
            grep -E 'error:' build_log.txt | sed 's/.*error: //' | sort | uniq -c | sort -rn | head -40
            echo '```'
            echo ""
            echo "### tail of build log"
            echo '```'
            tail -40 build_log.txt
            echo '```'
          } >> report.md
          tail -60 build_log.txt

      - name: Push resulting branch
        if: inputs.push_result
        run: |
          git push --force-with-lease origin "${{ inputs.target_branch }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escalation-${{ inputs.target_branch }}-${{ inputs.upstream_ref }}
          path: |
            report.md
            conflicts.txt
            merge_out.txt
            build_log.txt
          retention-days: 30

      - name: Job summary
        if: always()
        run: cat report.md >> $GITHUB_STEP_SUMMARY
